<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="suv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1726"/>
      <stop offset="50%" stop-color="#142c26"/>
      <stop offset="100%" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="suv-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="suv-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="suv-light-beam" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#suv-bg)"/>
  <line x1="40" y1="360" x2="760" y2="360" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <ellipse cx="400" cy="365" rx="340" ry="25" fill="#030811" opacity="0.8"/>

  <!-- Headlight beam -->
  <polygon points="110,285 0,250 0,335 110,305" fill="url(#suv-light-beam)"/>

  <!-- SUV Car Silhouette (Tall Roof) -->
  <path d="M110 285 Q130 230 220 220 L300 150 Q340 135 480 135 L610 140 Q660 145 680 230 L710 250 Q740 260 740 295 L730 325 Q715 335 680 335 L620 335 Q600 285 540 285 Q480 285 460 335 L300 335 Q280 285 220 285 Q160 285 140 335 L90 335 Q70 335 70 305 L80 290 Q90 285 110 285 Z" fill="url(#suv-body)" stroke="#475569" stroke-width="2"/>

  <!-- Windows (3 rows for 7-seater SUV) -->
  <path d="M310 155 L420 155 L420 215 L255 215 Q285 165 310 155 Z" fill="url(#suv-glass)" stroke="#34d399" stroke-width="1.5"/>
  <path d="M435 155 L545 155 L545 215 L435 215 Z" fill="url(#suv-glass)" stroke="#34d399" stroke-width="1.5"/>
  <path d="M560 155 L605 158 Q645 165 660 215 L560 215 Z" fill="url(#suv-glass)" stroke="#34d399" stroke-width="1.5"/>

  <!-- Roof Rails -->
  <path d="M320 130 L620 130" stroke="#f4961b" stroke-width="4" stroke-linecap="round"/>
  <line x1="340" y1="130" x2="340" y2="135" stroke="#64748b" stroke-width="3"/>
  <line x1="600" y1="130" x2="600" y2="135" stroke="#64748b" stroke-width="3"/>

  <!-- Headlights & Taillights -->
  <ellipse cx="100" cy="290" rx="14" ry="8" fill="#34d399"/>
  <path d="M730 265 Q740 270 735 295 L725 295 Z" fill="#ef4444"/>

  <!-- Front Wheel -->
  <circle cx="220" cy="335" r="54" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <circle cx="220" cy="335" r="34" fill="#1e293b"/>
  <circle cx="220" cy="335" r="14" fill="#64748b"/>
  <line x1="220" y1="305" x2="220" y2="365" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="190" y1="335" x2="250" y2="335" stroke="#94a3b8" stroke-width="2.5"/>
  
  <!-- Rear Wheel -->
  <circle cx="540" cy="335" r="54" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <circle cx="540" cy="335" r="34" fill="#1e293b"/>
  <circle cx="540" cy="335" r="14" fill="#64748b"/>
  <line x1="540" y1="305" x2="540" y2="365" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="510" y1="335" x2="570" y2="335" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Handles -->
  <rect x="350" y="230" width="28" height="6" rx="3" fill="#64748b"/>
  <rect x="475" y="230" width="28" height="6" rx="3" fill="#64748b"/>

  <text x="50" y="60" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" opacity="0.9">FAMILY SUV CLASS</text>
  <text x="50" y="88" fill="#10b981" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="1">MARUTI ERTIGA • CHEVROLET TAVERA</text>
</svg>
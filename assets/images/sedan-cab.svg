<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sedan-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1726"/>
      <stop offset="50%" stop-color="#0d2438"/>
      <stop offset="100%" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="car-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="gold-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4961b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="headlight-beam" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#sedan-bg)"/>
  
  <!-- Subtle Grid/Floor Horizon -->
  <line x1="40" y1="360" x2="760" y2="360" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <ellipse cx="400" cy="365" rx="340" ry="25" fill="#030811" opacity="0.8"/>

  <!-- Headlight beam -->
  <polygon points="120,290 0,260 0,340 120,310" fill="url(#headlight-beam)"/>

  <!-- Sedan Car Silhouette -->
  <!-- Main Chassis -->
  <path d="M120 290 Q140 235 240 230 L320 180 Q360 160 480 160 L540 165 Q620 170 660 235 L700 255 Q730 265 730 295 L720 325 Q710 335 680 335 L620 335 Q600 290 540 290 Q480 290 460 335 L300 335 Q280 290 220 290 Q160 290 140 335 L100 335 Q80 335 80 310 L90 295 Q100 290 120 290 Z" fill="url(#car-body)" stroke="#475569" stroke-width="2"/>

  <!-- Windows -->
  <path d="M330 185 L475 185 Q485 185 485 225 L275 225 Q305 190 330 185 Z" fill="url(#glass)" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M500 185 L540 188 Q600 195 635 225 L500 225 Z" fill="url(#glass)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Headlights & Taillights -->
  <ellipse cx="110" cy="295" rx="14" ry="7" fill="#38bdf8"/>
  <path d="M720 270 Q730 275 725 295 L715 295 Z" fill="#ef4444"/>

  <!-- Wheels Outer -->
  <!-- Front Wheel -->
  <circle cx="220" cy="335" r="50" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <circle cx="220" cy="335" r="32" fill="#1e293b"/>
  <circle cx="220" cy="335" r="14" fill="#64748b"/>
  <line x1="220" y1="305" x2="220" y2="365" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="190" y1="335" x2="250" y2="335" stroke="#94a3b8" stroke-width="2.5"/>
  
  <!-- Rear Wheel -->
  <circle cx="540" cy="335" r="50" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <circle cx="540" cy="335" r="32" fill="#1e293b"/>
  <circle cx="540" cy="335" r="14" fill="#64748b"/>
  <line x1="540" y1="305" x2="540" y2="365" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="510" y1="335" x2="570" y2="335" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Door Line & Details -->
  <line x1="490" y1="185" x2="485" y2="325" stroke="#1e293b" stroke-width="2"/>
  <rect x="360" y="240" width="28" height="6" rx="3" fill="#64748b"/>
  <rect x="515" y="240" width="28" height="6" rx="3" fill="#64748b"/>

  <!-- Subtle Model Badge -->
  <text x="50" y="60" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" opacity="0.9">SEDAN CLASS</text>
  <text x="50" y="88" fill="#f4961b" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="1">SUZUKI DZIRE • TOYOTA ETIOS</text>
</svg>